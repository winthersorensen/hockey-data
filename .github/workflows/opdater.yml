name: Opdater hockeydata
on:
  schedule:
    # Hverdage: hver halve time om aftenen (UTC 15-22 = kl. 16-23 dansk tid)
    - cron: '7,37 15-22 * * 1-5'
    # Weekend: hver halve time i kamptiden (UTC 10-19 = kl. 11-20 dansk tid)
    - cron: '7,37 10-19 * * 0,6'
    # Resten af døgnet: hver anden time
    - cron: '23 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opdater
  cancel-in-progress: false
jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hent data
        run: python hockey_scraper.py --output hockeydata.json
      - name: Gem hvis ændret
        run: |
          git config user.name "hockey-bot"
          git config user.email "hockey-bot@users.noreply.github.com"
          git add hockeydata.json
          git diff --cached --quiet || (git commit -m "Opdater hockeydata" && git push)
