name: Opdater hockeydata
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opdater
  cancel-in-progress: false
jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hent data
        run: python hockey_scraper.py --output hockeydata.json
      - name: Gem hvis ændret
        run: |
          git config user.name "hockey-bot"
          git config user.email "hockey-bot@users.noreply.github.com"
          git add hockeydata.json
          git diff --cached --quiet || (git commit -m "Opdater hockeydata" && git push)
